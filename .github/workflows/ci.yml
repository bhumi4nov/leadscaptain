name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    name: Test and Static Analysis
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: leadscaptain
          MYSQL_USER: leadscaptain
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      APP_ENV: testing
      APP_KEY: base64:SomeRandomTestingKeyForCI1234567890=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: leadscaptain
      DB_USERNAME: leadscaptain
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      QUEUE_CONNECTION: redis
      LEADSCAPTAIN_API_KEY: test-api-key
      LEADSCAPTAIN_BASE_URL: https://api.leadscaptain.com
      LEADSCAPTAIN_TIMEOUT: 30
      LEADSCAPTAIN_RETRY_TIMES: 3
      LEADSCAPTAIN_CONCURRENCY: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, mysql, pdo_mysql, pcov, redis
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer
        run: composer validate --strict

      - name: Build Docker image
        run: docker build -t leadscaptain:test .

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests with coverage
        run: php artisan test --coverage --min=90

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run Psalm
        run: vendor/bin/psalm --no-cache